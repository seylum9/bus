*{box-sizing:border-box;margin:0;padding:0}
.app{padding:12px;font-family:var(--font-sans)}
.header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.header h1{font-size:16px;font-weight:500;color:var(--text-primary)}

.now-bar{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:10px 12px;background:var(--surface-1);border-radius:var(--radius)}
.now-time{font-size:22px;font-weight:500;color:var(--text-primary)}
.next-info{font-size:13px;color:var(--text-accent);font-weight:500}

.direction-row{display:flex;gap:6px;margin-bottom:8px}
.direction-btn{flex:1;padding:7px 8px;font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.direction-btn.active{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.stop-picker,.route-picker{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stop-picker label,.route-picker label{flex-shrink:0;width:5em;font-size:13px;font-weight:600;color:#475569}
.stop-select,.route-select{flex:1;min-width:0;min-height:44px;padding:10px 12px;border:1px solid #94a3b8;border-radius:10px;background:#fff;color:#14532d;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.stop-select:focus-visible,.route-select:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.route-picker{margin-bottom:0}

.day-row{display:flex;gap:5px;margin-bottom:10px}
.day-btn{flex:1;padding:7px 2px;font-size:13px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.day-btn.active{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}


.service-day-help{margin-bottom:8px;font-size:12px;line-height:1.5;color:#475569}
.service-day-help summary{width:fit-content;padding:6px 0;cursor:pointer;color:#14532d}
.service-day-help summary:focus-visible{outline:2px solid #2563eb;outline-offset:2px;border-radius:3px}
.service-day-help details p{padding:6px 9px;margin-bottom:6px;border-left:2px solid #cbd5e1}

.hour-row{display:flex;align-items:flex-start;border-bottom:0.5px solid var(--border)}
.hour-row.current-hour .hour-label{color:var(--text-accent);font-weight:500}
.hour-label{width:34px;min-width:34px;font-size:14px;color:var(--text-secondary);padding:8px 0 8px 4px;line-height:1}
.times{display:flex;flex-wrap:wrap;gap:5px;padding:7px 4px;flex:1}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--text-primary);background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:3px 7px}
.chip.past{color:var(--text-muted);background:var(--surface-0)}
.chip.next{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent);font-weight:500}
.chip .rn{font-size:10px;font-weight:500;padding:1px 3px;border-radius:3px;background:var(--surface-0);color:var(--text-muted)}
.chip .via{font-size:10px;color:var(--text-muted);margin-left:1px}
.chip.next .rn{background:var(--border-accent);color:var(--text-accent)}
.chip.past .rn{color:var(--text-muted)}
.no-data{font-size:13px;color:var(--text-muted);padding:16px 4px;text-align:center}


html{width:100%;min-width:0;background:#fff;-webkit-text-size-adjust:100%}
body{width:100%;min-width:0;margin:0;background:#fff;color:var(--text-primary);overflow-x:hidden}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;padding:12px 12px max(86px,calc(env(safe-area-inset-bottom) + 72px));background:var(--surface-0)}
.header{position:sticky;top:0;z-index:5;margin:-12px -12px 12px;padding:12px 12px 10px;background:var(--surface-0);border-bottom:0.5px solid var(--border)}
.header h1{font-size:18px;line-height:1.35;font-weight:700;letter-spacing:0}
.now-bar{margin-bottom:10px;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-1);padding:11px 12px}
.now-time{font-size:28px;font-weight:700;letter-spacing:0}
.next-info{font-size:14px;line-height:1.35}
.control-panel{border:0.5px solid var(--border);border-radius:14px;background:var(--surface-1);padding:10px;margin-bottom:10px;scroll-margin-top:64px}
.direction-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px;background:var(--surface-0);border:0.5px solid var(--border);border-radius:10px;padding:2px}
.direction-btn{min-height:42px;border:0;border-radius:8px;background:transparent;font-size:14px}
.direction-btn.active{background:var(--bg-accent);box-shadow:0 0 0 0.5px var(--border-accent) inset}
.day-row{gap:6px;margin-bottom:8px}
.day-btn{min-height:42px;border-radius:10px;font-size:14px;font-weight:600}
.hour-row{border-bottom:0;margin-bottom:5px;border-radius:10px;background:var(--surface-0);scroll-margin-top:72px}
.hour-row.current-hour{box-shadow:0 0 0 1px var(--border-accent) inset;background:var(--bg-accent)}
.hour-label{width:42px;min-width:42px;padding:11px 0 8px 8px;font-size:16px;font-weight:700}
.times{gap:7px;padding:7px 5px 8px 2px}
.chip{flex-direction:column;justify-content:center;gap:4px;min-width:62px;min-height:56px;border-radius:10px;padding:6px 9px;background:var(--surface-2);font:inherit;font-size:15px;cursor:pointer}
.chip-main{display:inline-flex;align-items:center;gap:4px;line-height:1.2;font-variant-numeric:tabular-nums}
.chip.past{opacity:.44;background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.chip.past .rn,.chip.past .via{color:#64748b;background:#e2e8f0}
.chip.next{background:#dcfce7;color:#14532d;border-color:#86efac;font-weight:800}
.chip.next .rn{background:#bbf7d0;color:#14532d}
.chip.selected{background:#0f172a;color:#fff;border-color:#0f172a;font-weight:800;opacity:1}
.chip .rn{font-size:11px;border-radius:6px;padding:2px 4px;font-weight:700}
.chip .via{display:block;margin-left:0;font-size:11px;line-height:1.4;color:#475569;background:var(--surface-0);border-radius:6px;padding:1px 4px;white-space:nowrap}
.chip.next .via{color:#14532d;background:#bbf7d0}
.chip.selected .rn,.chip.selected .via{background:rgba(255,255,255,.16);color:#fff}
.trip-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0 10px 12px;background:rgba(15,23,42,.58)}
.trip-overlay[hidden]{display:none}
.trip-detail{position:relative;z-index:31;width:min(480px,100%);max-height:72vh;border:0.5px solid #cbd5e1;border-radius:14px;background:#fff;color:#0f172a;overflow:hidden;box-shadow:0 18px 42px rgba(15,23,42,.28);display:flex;flex-direction:column}

.trip-title{font-size:16px;font-weight:800;color:#0f172a}
.trip-meta{font-size:12px;color:#475569;margin-top:2px}
.trip-close{width:34px;height:34px;border:0.5px solid #cbd5e1;border-radius:17px;background:#fff;color:#0f172a;font-size:20px;line-height:1;cursor:pointer}
.trip-stops{padding:4px 0;overflow:auto;background:#fff}
.trip-actions{flex-shrink:0;padding:10px 12px;border-top:0.5px solid #cbd5e1;background:#fff}

.trip-position-link+.trip-position-link{margin-top:6px}

.trip-stop.active{background:#ecfdf5;color:#14532d;font-weight:700}

#d3.active{background:#1d4ed8}

  .now-time{font-size:26px}
  .hour-label{width:39px;min-width:39px;font-size:15px}
  .chip{min-height:52px;padding:5px 8px;font-size:14px}
}

<div class="app">
  <div class="header">
    <i class="ti ti-bus" aria-hidden="true" style="font-size:20px;color:var(--text-accent)"></i>
    <h1 id="header-title">安謝橋 時刻表 →那覇BT・旭橋方面</h1>
  </div>
  <div id="timetable">
    <div class="now-bar">
      <span class="now-time" id="now-time">--:--</span>
      <span class="next-info" id="next-info">…</span>
    </div>

    <div class="control-panel" id="control-panel">
    <div class="direction-row" id="direction-row">
      <button class="direction-btn active" onclick="setDirection('inbound',this)">那覇BT・旭橋方面</button>
      <button class="direction-btn" onclick="setDirection('outbound',this)">安謝橋方面</button>
    </div>

    <!-- バス停選択 -->
    <div class="stop-picker">
      <label for="stop-select">乗るバス停</label>
      <select id="stop-select" class="stop-select" onchange="setStop(this.value)"></select>
    </div>

    <!-- 平日/土曜/日曜/祝日 -->
    <div class="day-row">
      <button class="day-btn" id="d1" onclick="setDay(1,this)">平日</button>
      <button class="day-btn" id="d3" onclick="setDay(3,this)">土曜</button>
      <button class="day-btn" id="d4" onclick="setDay(4,this)">日曜</button>
      <button class="day-btn" id="d5" onclick="setDay(5,this)">祝日</button>
    </div>
    <div class="service-day-help">
      <p>祝日は手動で「祝日」を選択してください。</p>
      <details>
        <summary>運行日の注意</summary>
        <p>全18路線とも、年末年始（12/31〜1/3）・旧盆（旧暦7/15）は「日曜」を選択してください。</p>
      </details>
    </div>

    <!-- 路線フィルター -->
    <div class="route-picker">
      <label for="route-select">路線</label>
      <select id="route-select" class="route-select" onchange="setFilter(this.value)"></select>
    </div>
    </div>

    <div id="grid"></div>
    <div class="data-footer" id="data-footer"></div>
    <div class="quick-actions" id="quick-actions">
      <button type="button" class="quick-action" onclick="scrollToControls()">条件変更</button>
      <button type="button" class="quick-action primary" onclick="scrollToNextBus()">次の便</button>
    </div>
    <div class="trip-overlay" id="trip-overlay" hidden onclick="closeTrip(event)">
      <div class="trip-detail" id="trip-detail" onclick="event.stopPropagation()"></div>
    </div>
  </div>

</div>

    {label:'のりば11',station:'e6b942f3-9542-41e3-acad-22a2d44fbd13',routes:['20','26','120']}
  ]
};
function getRoutePositionLinks(route, direction, stop, via){
  const routes=direction==='inbound'?APPROACH:direction==='outbound'?APPROACH_OUTBOUND:null;
  const cg=routes?.[route];
  if(!cg) return [];
  const station=stop==='泊高橋'?POSITION_TOMARI[direction]?.[via]:POSITION_STOPS[direction]?.[stop];
  const platforms=stop==='那覇BT'
    ? POSITION_TERMINAL[direction].filter(p=>p.routes.includes(String(route)))
    : station?[{station,label:''}]:[];
  return platforms.map(p=>({label:p.label,url:`https://www.busnavi-okinawa.com/mobile/Timetable/BusPosition?stationSid=${p.station}&cgSid=${cg}#mine`}));
}

let currentDirection = 'inbound';
let currentStop = '安謝橋';
let currentDay = 1;
let currentFilter = 'all';
let currentTripId = '';
let pendingAutoScroll = false;

function dayKey(){
  return currentDay===1?'wd':currentDay===3?'sat':currentDay===5?'holiday':'sun';
}
function directionConfig(){
  return {...DIRECTIONAL_GTFS[currentDirection],
    ...(currentDirection==='inbound'?{label:'那覇BT・旭橋方面'}:{}),
    stops:getTimetableStops(currentDirection)};
}
function getStopData(stop, key) {
  const d = getTimetableRows(currentDirection, stop, key);
  return d.map(([r,t,via,trip,note]) => ({r,t,via:via||'',trip:trip||'',note:note||''}));
}
function setDirection(direction,btn){
  currentDirection=direction;
  document.querySelectorAll('.direction-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentStop=directionConfig().stops[0];
  currentFilter='all';
  currentTripId='';
  initStops();
  updateHeader();
  renderFilters();
  renderTimetable();
}
function setDay(d,btn){
  currentDay=d;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter='all';
  currentTripId='';
  renderFilters();
  renderTimetable();
}
function setStop(s){
  if(!directionConfig().stops.includes(s)) return;
  currentStop=s;
  document.getElementById('stop-select').value=s;
  updateHeader();
  currentFilter='all';
  currentTripId='';
  renderFilters();
  renderTimetable();
}
function setFilter(f){
  if(f!=='all'&&!getStopData(currentStop,dayKey()).some(x=>x.r===f)) return;
  currentFilter=f;
  currentTripId='';
  document.getElementById('route-select').value=f;
  renderTimetable();
}
function updateHeader(){
  document.getElementById('header-title').textContent = currentStop + ' 時刻表 →' + directionConfig().label;
}

function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function getNow(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function todayDayNumber(){
  const dow=new Date().getDay();
  return dow===0?4:dow===6?3:1;
}
function isSelectedDayToday(){
  return currentDay===todayDayNumber();
}
function updateDataFooter(){
  const el=document.getElementById('data-footer');
  if(!el) return;
  const dates=[...new Set(TIMETABLE_GROUPS.map(group=>group.retrievedDate))].sort();
  const acquired=dates.length===1?dates[0]:`${dates[0]}〜${dates.at(-1)}`;
  const routeCount=new Set(TIMETABLE_GROUPS.flatMap(group=>group.routes)).size;
  el.textContent=`全${routeCount}路線：${acquired}取得 / 出典: バスマップ沖縄(kotsu-okinawa.org)`;
}

function relevantTimeTarget(){
  return document.querySelector('.chip.next') || document.querySelector('.hour-row.current-hour') || document.querySelector('.hour-row');
}

function autoScrollToRelevantTime(){
  if(!pendingAutoScroll) return;
  pendingAutoScroll=false;
  if(currentTripId) return;
  requestAnimationFrame(()=>{
    const target=relevantTimeTarget();
    if(target) target.scrollIntoView({block:'center', behavior:'smooth'});
  });
}

function scrollToControls(){
  pendingAutoScroll=false;
  document.getElementById('control-panel')?.scrollIntoView({block:'start', behavior:'smooth'});
}

function scrollToNextBus(){
  pendingAutoScroll=false;
  const target=relevantTimeTarget();
  if(target) target.scrollIntoView({block:'center', behavior:'smooth'});
}

function selectTrip(tripId){
  currentTripId = currentTripId===tripId ? '' : tripId;
  renderTimetable();
}

function closeTrip(event){
  if(event && event.target && event.target.id !== 'trip-overlay') return;
  currentTripId='';
  renderTimetable();
}

function getTripStops(tripId){
  if(!tripId) return [];
  const key=dayKey();
  const stops=directionConfig().stops;
  return stops.flatMap(stop=>{
    const hit=getStopData(stop,key).find(x=>x.trip===tripId);
    return hit ? [{stop,...hit}] : [];
  });
}

function renderTripDetail(){
  const overlay=document.getElementById('trip-overlay');
  const detail=document.getElementById('trip-detail');
  const stops=getTripStops(currentTripId);
  if(!stops.length){
    overlay.hidden=true;
    detail.innerHTML='';
    return;
  }
  const current=stops.find(x=>x.stop===currentStop) || stops[0];
  const via=current.via?`${esc(current.via)}経由`:'経由情報なし';
  const positionLinks=getRoutePositionLinks(current.r,currentDirection,currentStop,current.via);
  overlay.hidden=false;
  detail.innerHTML=
    `<div class="trip-head">`+
      `<div><div class="trip-title">${esc(current.r)}番 ${esc(current.note)} ${esc(current.t)} ${via}</div>`+
      `<div class="trip-meta">${esc(directionConfig().label)} / ${esc(currentStop)}発</div></div>`+
      `<button type="button" class="trip-close" onclick="closeTrip()" aria-label="閉じる">&times;</button>`+
    `</div>`+
    `<div class="trip-stops">`+
      stops.map(x=>`<div class="trip-stop${x.stop===currentStop?' active':''}">`+
        `<span class="trip-time">${esc(x.t)}</span><span>${esc(x.stop)}</span>`+
      `</div>`).join('')+
    `</div>`+
    (positionLinks.length ? `<div class="trip-actions">`+
      positionLinks.map(link=>`<a class="trip-position-link" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">この路線の現在位置を見る${link.label?`（${esc(link.label)}）`:''} ↗</a>`).join('')+
      `<p class="trip-position-note">バスなびを別タブで開きます。${esc(currentStop)}を基準に同じ路線・方向を表示します。便・経由は絞り込まれません。${positionLinks.length>1?'この路線は乗り場が複数あります。乗り場別に確認してください。':''}</p>`+
    `</div>` : '');
}

function renderFilters(){
  const data = getStopData(currentStop, dayKey());
  const routes = [...new Set(data.map(x=>x.r))].sort((a,b)=>Number(a)-Number(b));
  const select = document.getElementById('route-select');
  select.innerHTML = '<option value="all">全路線</option>' +
    routes.map(r=>`<option value="${esc(r)}">${esc(r)}番</option>`).join('');
  select.value=currentFilter;
}

function renderTimetable(){
  const now = getNow();
  const useLiveTime = isSelectedDayToday();
  const baseData = getStopData(currentStop, dayKey());
  let data = baseData.slice();
  if(currentFilter !== 'all') data = data.filter(x=>x.r===currentFilter);
  data.sort((a,b)=>t2m(a.t)-t2m(b.t));

  const nxt = useLiveTime ? data.find(x=>t2m(x.t)>=now) : null;
  const hh=String(Math.floor(now/60)).padStart(2,'0');
  const mm=String(now%60).padStart(2,'0');
  document.getElementById('now-time').textContent=hh+':'+mm;
  if(nxt){
    const diff=t2m(nxt.t)-now;
    const via=nxt.via?` ${nxt.via}経由`:'';
    document.getElementById('next-info').textContent=`次: ${nxt.t} (${nxt.r}番${nxt.note?' '+nxt.note:''}${via}) あと${diff}分`;
  } else if(!useLiveTime){
    document.getElementById('next-info').textContent='';
  } else {
    document.getElementById('next-info').textContent='本日の運行は終了';
  }

  updateDataFooter();
  const hmap={};
  data.forEach(x=>{
    const h=parseInt(x.t.split(':')[0]);
    if(!hmap[h])hmap[h]=[];
    hmap[h].push(x);
  });
  const hours=Object.keys(hmap).map(Number).sort((a,b)=>a-b);
  const nowH=Math.floor(now/60);
  let html='';
  hours.forEach(h=>{
    const chips=hmap[h];
    const isCur=useLiveTime&&h===nowH;
    html+=`<div class="hour-row${isCur?' current-hour':''}"><div class="hour-label">${String(h).padStart(2,'0')}</div><div class="times">`;
    chips.forEach(c=>{
      const isPast=useLiveTime&&t2m(c.t)<now;
      const isNext=nxt&&c.t===nxt.t&&c.r===nxt.r;
      const cls=(c.trip===currentTripId?'selected ': '')+(isNext?'next':isPast?'past':'');
      const via=c.via?`<span class="via">${esc(c.via)}${c.note?'・'+esc(c.note):''}</span>`:'';
      html+=`<button type="button" class="chip ${cls}" onclick="selectTrip('${c.trip}')" aria-label="${esc(c.r)}番 ${esc(c.t)}${c.via?' '+esc(c.via)+'経由':''}${c.note?' '+esc(c.note):''}の詳細"><span class="chip-main"><span class="rn">${c.r}</span><span>${c.t.split(':')[1]}</span></span>${via}</button>`;
    });
    html+='</div></div>';
  });
  if(!html)html='<p class="no-data">この日の運行はありません。</p>';
  document.getElementById('grid').innerHTML=html;
  renderTripDetail();
}

function initStops(){
  const select=document.getElementById('stop-select');
  select.innerHTML=directionConfig().stops.map(s=>
    `<option value="${esc(s)}"${s===currentStop?' selected':''}>${esc(s)}</option>`
  ).join('');
  select.value=currentStop;
}

function initDay(){
  const dow=new Date().getDay();
  const dayId=dow===0?'d4':dow===6?'d3':'d1';
  const dayNum=dow===0?4:dow===6?3:1;
  currentDay=dayNum;
  document.getElementById(dayId).classList.add('active');
}

initStops();
initDay();
updateHeader();
renderFilters();
renderTimetable();
setInterval(()=>{if(isSelectedDayToday())renderTimetable();},30000);
</script>
